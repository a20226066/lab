# =====================================================================
# ALTERNATIVA IMPLEMENTADA: "Camino 1 - messages.properties"
# Cuando Spring no puede convertir el texto del formulario al tipo del
# atributo (p. ej. "abc" -> Double) genera el codigo de error "typeMismatch".
# Formato: typeMismatch.<objeto del @ModelAttribute>.<atributo>=mensaje
# El campo queda en null y el error se muestra junto al input (no se guarda).
# Archivo guardado en UTF-8 (spring.messages.encoding=UTF-8).
# =====================================================================

# ---------- Producto (Pregunta 3) ----------
typeMismatch.product.price=El precio debe ser un número válido (por ejemplo 12.50)
typeMismatch.product.stock=El stock debe ser un número entero (sin letras ni decimales)
