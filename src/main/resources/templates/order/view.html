<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Detalle de pedido')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('pedidos')}"></nav>

<main class="container">
    <h2 th:text="|${invoice.type} N° ${invoice.id}|"></h2>
    <p>
        <strong>Fecha:</strong> <span th:text="${#temporals.format(invoice.date, 'dd/MM/yyyy')}"></span><br>
        <strong>Cliente:</strong> <span th:text="${invoice.customer.name}"></span>
        (<span th:text="|${invoice.customer.documentType} ${invoice.customer.document}|"></span>)
    </p>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>Producto</th>
            <th class="text-end">Cantidad</th>
            <th class="text-end">Precio (S/)</th>
            <th class="text-end">Subtotal (S/)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${invoice.details}">
            <td th:text="${d.product.name}"></td>
            <td class="text-end" th:text="${d.quantity}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(d.price, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">TOTAL (S/)</th>
            <th class="text-end" th:text="${#numbers.formatDecimal(invoice.total, 1, 'COMMA', 2, 'POINT')}"></th>
        </tr>
        </tfoot>
    </table>

    <a class="btn btn-secondary" th:href="@{/order/list}">Volver</a>
</main>
</body>
</html>
