<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
    Fragmentos Thymeleaf reutilizables.
    Se incluyen en TODAS las vistas con th:replace, asi el menu se escribe una sola vez.
    Solo se usa el CSS de Bootstrap (sin JavaScript, como pide el laboratorio).
-->

<!-- Fragmento 1: <head> comun. Recibe el titulo de la pagina como parametro -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Portal de gestión comercial'">Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
<!--
    Fragmento 2: menu de navegacion.
    El parametro "activo" indica que opcion resaltar (inicio, clientes, catalogo, pedidos).
-->
<nav th:fragment="menu(activo)" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Gestión Comercial</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}">Inicio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activo == 'clientes'} ? 'active'"
                   th:href="@{/customer/list}">Clientes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activo == 'catalogo'} ? 'active'"
                   th:href="@{/product/list}">Catálogo</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activo == 'pedidos'} ? 'active'"
                   th:href="@{/order/list}">Pedidos</a>
            </li>
        </ul>
    </div>
</nav>

<!-- Fragmento 3: mensajes flash (RedirectAttributes) que llegan luego de un redirect -->
<div th:fragment="alertas">
    <div th:if="${msg != null}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
</div>
</body>
</html>
