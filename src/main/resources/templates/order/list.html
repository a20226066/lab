<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Pedidos')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('pedidos')}"></nav>

<main class="container">
    <h2>Pedidos</h2>

    <div th:replace="~{fragments/menu :: alertas}"></div>

    <a class="btn btn-primary mb-3" th:href="@{/order/new}">Nuevo pedido</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>N°</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Documento</th>
            <th class="text-end">Total (S/)</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inv : ${invoiceList}">
            <td th:text="${inv.id}"></td>
            <td th:text="${inv.type}"></td>
            <!-- #temporals formatea LocalDate -->
            <td th:text="${#temporals.format(inv.date, 'dd/MM/yyyy')}"></td>
            <!-- Gracias a @ManyToOne se obtiene el nombre del cliente, no solo su id -->
            <td th:text="${inv.customer.name}"></td>
            <td th:text="|${inv.customer.documentType} ${inv.customer.document}|"></td>
            <!-- getTotal() suma los subtotales en Java -->
            <td class="text-end" th:text="${#numbers.formatDecimal(inv.total, 1, 'COMMA', 2, 'POINT')}"></td>
            <td><a class="btn btn-sm btn-info" th:href="@{/order/view(id=${inv.id})}">Ver detalle</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(invoiceList)}">
            <td colspan="7" class="text-center">No hay pedidos registrados</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
