<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Catálogo')}"></head>
<body>
<nav th:replace="~{fragments/menu :: menu('catalogo')}"></nav>

<main class="container">
    <h2>Catálogo de productos</h2>

    <div th:replace="~{fragments/menu :: alertas}"></div>

    <a class="btn btn-primary mb-3" th:href="@{/product/new}">Nuevo producto</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Precio (S/)</th>
            <th>Stock disponible</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p, stat : ${productList}">
            <td th:text="${stat.count}"></td>
            <td th:text="${p.name}"></td>
            <!-- #numbers.formatDecimal: 2 decimales con punto como separador -->
            <td th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{/product/edit(id=${p.id})}">Editar</a>
                <a class="btn btn-sm btn-danger" th:href="@{/product/delete(id=${p.id})}">Borrar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(productList)}">
            <td colspan="5" class="text-center">No hay productos registrados</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
