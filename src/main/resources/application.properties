spring.application.name=lab7

# ---------- Conexion a la BD lab6 (MySQL) ----------
# serverTimezone=America/Lima evita desfases al guardar/leer fechas (ver guia "Gestion de fechas")
spring.datasource.url=jdbc:mysql://localhost:3306/lab6?serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Las tablas ya existen (script del enunciado): Hibernate NO debe crearlas ni modificarlas
spring.jpa.hibernate.ddl-auto=none
# Ver el SQL que genera JPA en consola (util para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- messages.properties ----------
# Spring Boot lee por defecto "messages.properties"; lo declaramos explicito y en UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8
